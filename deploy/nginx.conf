# EventTracker behind nginx (VPS deployments).
#
#   · terminates TLS
#   · proxies the API and the websocket used for chat and notification pushes
#   · serves the built client straight from disk when it is available
#
# Replace events.example.com and the certificate paths before using this.

upstream eventtracker_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name events.example.com;
    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name events.example.com;

    ssl_certificate     /etc/letsencrypt/live/events.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Covers are up to 8 MB, videos up to 80 MB.
    client_max_body_size 90m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Build output can be served without waking the Node process.
    root /var/www/eventtracker/client/dist;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://eventtracker_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
